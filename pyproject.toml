[project]
name = "iotbot"
version = "2.0.0.dev0"
description = "Telegram bot to control IR devices and Broadlink plugs at home"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==22.8",
    "broadlink==0.19.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
iotbot = "iotbot.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iotbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
